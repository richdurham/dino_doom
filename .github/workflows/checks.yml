# Pre-merge checks for the game file. The game has no build step and no dependencies, so
# this just runs tools/check.js on a bare Node: it parses the inline scripts, boots the
# game headlessly, runs the in-game editor's own audit over the shipped floors, and plays
# a burst of frames on each one.
name: Checks

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Game checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run checks
        run: node tools/check.js
